server:
  port: ${STATION_HTTP_PORT:8090}

station:
  id: ${STATION_ID:spark-1}
  display: ${STATION_DISPLAY::99}
  size: ${STATION_SIZE:1280x720}
  # Video enviado al browser (ej. 854x480). Vacío = STATION_SIZE. El juego y el input siguen en STATION_SIZE.
  stream-size: ${STATION_STREAM_SIZE:}
  stream-scaler: ${STATION_STREAM_SCALER:bicubic}
  fps: ${STATION_FPS:60}
  video-bitrate: ${STATION_VIDEO_BITRATE:5000000}
  library-root: ${LIBRARY_ROOT:/opt/station-library}
  cache-root: ${CACHE_ROOT:/tmp/cloudgame-cache}
  idle-timeout-s: ${IDLE_TIMEOUT_S:300}
  # true (la imagen lo activa): tras una partida, stop vacía CACHE_ROOT, restaura HOME y borra `saves` del manifiesto.
  reset-saves: ${STATION_RESET_SAVES:false}
  # game-crud para saves de jugadores con sesión (lo pasa el dispatcher). Vacío = todos como anónimos.
  saves-url: ${SAVES_URL:}
  game-manifest: ${GAME_MANIFEST:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ice-servers: ${ICE_SERVERS:stun:stun.l.google.com:19302}
  ice-host-ips: ${ICE_HOST_IPS:}
  ice-host-policy: ${ICE_HOST_POLICY:all}

logging:
  level:
    com.cloudgame.station: INFO
