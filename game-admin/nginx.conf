# El nginx de game-client reenvía /admin/ → acá sin el prefijo.
server {
    listen ${ADMIN_LISTEN};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # game-crud (mismo origen: sin CORS).
    location /api/ {
        # Subida de imágenes; game-crud corta en IMAGES_MAX_MB.
        client_max_body_size 32m;
        proxy_pass ${CRUD_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
