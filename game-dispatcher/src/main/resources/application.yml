server:
  port: ${DISPATCHER_HTTP_PORT:8094}

dispatcher:
  api-token: ${DISPATCHER_API_TOKEN:}            # Bearer de la API admin (/stations, /pool); vacío = sin auth (solo desarrollo)
  loader-url: ${LOADER_URL:http://127.0.0.1:8095}
  loader-token: ${LOADER_API_TOKEN:}
  crud-url: ${CRUD_URL:http://127.0.0.1:8096}
  station-host: ${STATION_HOST:127.0.0.1}        # host con el que el dispatcher llega a cada estación (host network)
  stations-url: ${DISPATCHER_STATIONS_URL:/ports} # prefijo que recibe el browser: <stations-url>/<httpPort>
  jwt-secret: ${CLOUDGAME_JWT_SECRET:}               # mismo que game-crud; vacío = solo jugadores anónimos
  save-grant-ttl-h: ${DISPATCHER_SAVE_GRANT_TTL_H:24}
  saves-url: ${DISPATCHER_SAVES_URL:http://127.0.0.1:8096} # game-crud visto desde las estaciones
  prepare-version: ${DISPATCHER_PREPARE_VERSION:1.0.0}
  warm-pool: ${DISPATCHER_WARM_POOL:true}         # false = no crea estaciones por adelantado (ignora minContainers)
  inactivity-timeout-s: ${DISPATCHER_INACTIVITY_TIMEOUT_S:300}
  free-ttl-s: ${DISPATCHER_FREE_TTL_S:600}
  claim-timeout-s: ${DISPATCHER_CLAIM_TIMEOUT_S:60}
  disconnect-grace-s: ${DISPATCHER_DISCONNECT_GRACE_S:30}
  provision-timeout-s: ${DISPATCHER_PROVISION_TIMEOUT_S:180}
  health-failures: ${DISPATCHER_HEALTH_FAILURES:5}
  poll-interval-ms: ${DISPATCHER_POLL_INTERVAL_MS:2000}
  pool-interval-ms: ${DISPATCHER_POOL_INTERVAL_MS:10000}
  catalog-refresh-s: ${DISPATCHER_CATALOG_REFRESH_S:60}
  wait-step-ms: 500
  session-retention-s: 600
  cors-origins: ${DISPATCHER_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.cloudgame.dispatcher: INFO
