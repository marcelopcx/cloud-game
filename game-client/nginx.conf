map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80 HTTP: solo el challenge ACME (TLS_CERT=acme); el resto va a HTTPS.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/acme/webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 5173 HTTP: túnel SSH / LAN. Chrome bloquea WebRTC en http://IP.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /station/ {
        proxy_pass ${STATION_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Una estación por juego (compose multi). $station_port sale de conf.d/stations.conf.
    location ~ ^/stations/(?<station_game>[a-z0-9-]+)/(?<station_path>.*)$ {
        if ($station_port = "") {
            return 404;
        }
        proxy_pass http://127.0.0.1:$station_port/$station_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Game Dispatcher: el browser pide, consulta y libera su sesión de juego. Solo esas
    # tres operaciones; la API admin (/stations, /pool) y el loader no se exponen.
    location = /dispatcher/sessions {
        limit_except POST { deny all; }
        proxy_pass ${DISPATCHER_UPSTREAM}/sessions;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ "^/dispatcher/sessions/(?<session_id>[0-9a-f-]{36})$" {
        limit_except GET DELETE { deny all; }
        proxy_pass ${DISPATCHER_UPSTREAM}/sessions/$session_id;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Estaciones que asigna el dispatcher (host network, LOADER_BASE_PORT 8200…8299).
    location ~ ^/ports/(?<loader_port>82[0-9][0-9])/(?<loader_path>.*)$ {
        proxy_pass http://127.0.0.1:$loader_port/$loader_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Catálogo del home (game-crud), público y de solo lectura: solo GET de /games,
    # /categories, /home (la distribución del home) y /avatars (los que puede elegir el
    # jugador). Crear/editar/borrar va por /admin/api/ con el login del admin.
    location ~ ^/catalog/(?<catalog_path>(games|categories|home|avatars)(/.*)?)$ {
        limit_except GET { deny all; }
        proxy_pass ${CRUD_UPSTREAM}/$catalog_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Imágenes del catálogo (game-crud las guarda en su volumen): públicas, solo GET. El nombre
    # lleva el hash del contenido y game-crud las marca immutable.
    location /media/ {
        limit_except GET { deny all; }
        proxy_pass ${CRUD_UPSTREAM};
        proxy_set_header Host $host;
        # Spring agrega Vary: Origin. El banner se pide como <img> y con crossOrigin (useImageTint):
        # con Vary, una petición pisa la entrada de caché de la otra y se re-descarga en cada recarga.
        proxy_hide_header Vary;
    }

    # Usuarios del inicio de sesión: consultar por email (GET) y registrar el username (POST).
    # Provisorio, sin autenticación propia todavía.
    location ~ ^/catalog/(?<users_path>users(/.*)?)$ {
        limit_except GET POST { deny all; }
        proxy_pass ${CRUD_UPSTREAM}/$users_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sesión de jugadores: registro y login (game-crud valida la contraseña y firma el token), usuario del token
    # y elegir avatar (PUT /auth/me/avatar, con el token).
    # /saves de game-crud no se publica: solo lo usan las estaciones por loopback.
    location ~ ^/catalog/(?<auth_path>auth/(register|login|me|me/avatar))$ {
        limit_except GET POST PUT { deny all; }
        proxy_pass ${CRUD_UPSTREAM}/$auth_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Amigos en vivo (SSE, Bearer): quién empieza o deja de jugar y cambios en solicitudes. Sin buffer
    # para que cada evento llegue al instante; game-crud manda un ping cada 25 s.
    location = /catalog/friends/events {
        limit_except GET { deny all; }
        proxy_pass ${CRUD_UPSTREAM}/friends/events;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Amigos del jugador con sesión (Bearer): lista completa, en partida (game-crud le pregunta al dispatcher),
    # buscador de jugadores y solicitudes (bandeja, enviar, aceptar, rechazar).
    location ~ ^/catalog/(?<friends_path>friends(/(playing|search|requests(/[0-9]+/(accept|reject))?))?)$ {
        limit_except GET POST { deny all; }
        proxy_pass ${CRUD_UPSTREAM}/$friends_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Login de /admin/, /docs/ y /api-docs/: basic auth contra la tabla ADMIN de game-crud
    # (GET /admins/verify: 204 pasa, 401 trae WWW-Authenticate y el navegador pide la clave).
    location = /_admin_auth {
        internal;
        proxy_pass ${CRUD_UPSTREAM}/admins/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # Panel game-admin (catálogo y administradores).
    location /admin/ {
        auth_request /_admin_auth;
        # Subida de imágenes (PUT /admin/api/games/{id}/images/{tipo}); game-crud corta en IMAGES_MAX_MB.
        client_max_body_size 32m;
        proxy_pass ${ADMIN_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación del proyecto (game-docs, Starlight), con el mismo login que /admin/.
    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        auth_request /_admin_auth;
        proxy_pass ${DOCS_SITE_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación Scalar (game-api), con el mismo login que /admin/.
    location = /api-docs {
        return 301 /api-docs/;
    }

    location /api-docs/ {
        auth_request /_admin_auth;
        proxy_pass ${DOCS_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Logs en vivo (SSE) del loader.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html siempre se revalida para que un deploy se vea sin recargar a la fuerza;
    # los bundles de Vite llevan hash en el nombre y se cachean para siempre.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# 443 HTTPS: acceso por internet. Secure context para WebRTC (cert de docker/16-tls-certs.sh).
