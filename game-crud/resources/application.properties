spring.application.name=game-crud

# Variables DB_* del .env de game-crud (el mismo que usa compose.yaml).
# Una variable de entorno real tiene prioridad sobre el archivo.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=game-crud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:5000}

# El esquema lo definen schemas/*.sql; Hibernate solo comprueba que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carga categorías, gamepads e imágenes de varios juegos por lote (evita N+1 al listar).
spring.jpa.properties.hibernate.default_batch_fetch_size=50

server.port=${SERVER_PORT:8096}

# Health de Actuator en /health (incluye el chequeo de la base).
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# OpenAPI JSON en /v3/api-docs; la vista es Scalar (game-api, /api-docs/ con el login del admin).
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
# Incluye /health en la documentación.
springdoc.show-actuator=true

# Primer administrador del panel (/admin/, /docs/, /api-docs/): se crea solo si la tabla ADMIN
# está vacía. Los demás se administran desde game-admin.
admin.bootstrap.username=${ADMIN_USER:admin}
admin.bootstrap.password=${ADMIN_PASSWORD:}

# Sesión de jugadores y saves. CLOUDGAME_JWT_SECRET es el mismo que usa game-dispatcher; vacío =
# /auth y /saves responden 503 (el catálogo sigue andando).
cloudgame.jwt-secret=${CLOUDGAME_JWT_SECRET:}
cloudgame.user-token-ttl-days=${CLOUDGAME_USER_TOKEN_TTL_DAYS:30}
cloudgame.saves-root=${SAVES_ROOT:/var/lib/cloudgame/saves}
cloudgame.saves-max-mb=${SAVES_MAX_MB:256}

# Imágenes del catálogo: se suben desde game-admin (PUT /games/{id}/images/{tipo}) y se sirven en
# /media/**. Al arrancar se descargan las URLs externas que queden en IMAGE y se optimizan las locales
# que no estén en WebP (IMAGES_IMPORT_EXTERNAL).
cloudgame.images-root=${IMAGES_ROOT:/var/lib/cloudgame/images}
cloudgame.images-max-mb=${IMAGES_MAX_MB:25}
cloudgame.images-import-external=${IMAGES_IMPORT_EXTERNAL:true}
# Achica cada imagen al tamaño de su tipo y la pasa a WebP (ImageMagick en la imagen Docker).
cloudgame.images-optimize=${IMAGES_OPTIMIZE:true}

# Amigos jugando: el estado de partida lo sabe game-dispatcher (GET /players/playing), no la base.
cloudgame.dispatcher-url=${DISPATCHER_URL:http://127.0.0.1:8094}
cloudgame.dispatcher-token=${DISPATCHER_API_TOKEN:}
