name: cloudgame-db

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-cloud_game}
      POSTGRES_USER: ${DB_USER:-cloudgame}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudgame}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data: