# Documentación Scalar. El nginx de game-client la publica en /api-docs/ (mismo basic auth
# que /admin/) y reenvía acá sin el prefijo; este nginx solo escucha en loopback.
server {
    listen ${DOCS_LISTEN};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # game-crud: OpenAPI generado por springdoc (/v3/api-docs) y "Probar" de Scalar.
    location /crud/ {
        proxy_pass ${CRUD_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # game-loader con el Bearer puesto acá (el token no llega al browser). Quien entra a
    # /api-docs/ ya pasó el basic auth del admin.
    location /loader/ {
        proxy_pass ${LOADER_UPSTREAM}/;
        proxy_set_header Authorization "Bearer ${LOADER_API_TOKEN}";
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # logs/stream es SSE.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # game-dispatcher: el Bearer de la API admin (/stations, /pool) lo pone nginx; /sessions
    # pide además el header X-Player-Id, que se carga en "Probar".
    location /dispatcher/ {
        proxy_pass ${DISPATCHER_UPSTREAM}/;
        proxy_set_header Authorization "Bearer ${DISPATCHER_API_TOKEN}";
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Estaciones: la fija (8090) y las del loader (8200…8299), igual que /ports/ en game-client.
    location ~ ^/station/(?<station_port>8090|82[0-9][0-9])/(?<station_path>.*)$ {
        proxy_pass http://${STATION_HOST}:$station_port/$station_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ \.ya?ml$ {
        types { application/yaml yaml yml; }
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
