# Documentación Starlight. El nginx de game-client la publica en /docs/ (mismo basic auth que
# /admin/) y reenvía acá sin el prefijo; este nginx solo escucha en loopback.
server {
    listen ${DOCS_SITE_LISTEN};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # El menú de Starlight antepone /docs a sus links: la referencia Scalar vive en /api-docs/.
    location = /api-docs/ {
        return 302 /api-docs/;
    }

    # Assets con hash en el nombre: cache larga.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        # Sin "$uri/": nginx redirigiría a /despliegue/ y se perdería el prefijo /docs.
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
